<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speaker — Whisper</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0807'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%239fc4e8'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=IBM+Plex+Mono:wght@400&family=Public+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="speak.css">
</head>
<body>

  <!-- Same still, untinted. Contrast comes from the glass, not a wash. -->
  <div class="backdrop">
    <video
      class="backdrop__video"
      autoplay muted loop playsinline
      preload="auto"
      aria-hidden="true"
      data-bg-video>
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260405_171521_25968ba2-b594-4b32-aab7-f6b69398a6fa.mp4" type="video/mp4">
    </video>
    <div class="backdrop__scrim"></div>
  </div>

  <div class="speaker">

    <header class="speaker__bar glass">
      <div class="speaker__brand">
        <span class="wordmark">Whisper</span>
        <a class="speaker__back cursor-target" href="index.html">&#8592; Back</a>
        <span class="badge-sim" data-sim-badge hidden>Simulated</span>
      </div>

      <div class="statusbar">
        <span class="pill" data-pill="device"><span class="pill__dot"></span>Device</span>
        <span class="pill" data-pill="server"><span class="pill__dot"></span>Server</span>
        <button class="pill cursor-target" data-pill="voice" data-actionable type="button" data-voice-enable>
          <span class="pill__dot"></span><span data-voice-label>Voice</span>
        </button>
        <select class="voice-select cursor-target" data-voice-select aria-label="Speech voice, grouped by accent and gender"></select>
        <button class="pill cursor-target" data-pill="mic" data-actionable type="button" data-mic-toggle aria-pressed="false" aria-label="Toggle microphone transcription">
          <span class="pill__dot"></span><span data-mic-label>Mic</span>
        </button>
      </div>
    </header>

    <div class="speaker__body">

      <section class="stage">
        <p class="label stage__hint" data-stage-hint data-reply="false">Nudge to choose &middot; press to speak</p>

        <div
          class="ring"
          data-ring
          role="listbox"
          aria-label="Predicted things to say"
          tabindex="0">

          <!-- Flows between slots. Uniform slot size means it only
               translates, which is what keeps the motion liquid. -->
          <div class="ring__lens" data-lens aria-hidden="true"></div>

          <div class="hub" data-hub>
            <span class="hub__dir" data-hub-dir aria-hidden="true">&middot;</span>
            <span class="hub__state" data-hub-state>Idle</span>
          </div>
          <!-- .slot elements injected here -->
        </div>
      </section>

      <aside class="rail glass" aria-label="Agent state">
        <div class="rail__block">
          <p class="label">Context</p>
          <div data-context></div>
        </div>

        <div class="rail__block rail__block--grow">
          <p class="label">Trace</p>
          <div class="trace" data-trace></div>
        </div>
      </aside>

    </div>

    <footer>
      <div class="utterance glass glass--strong">
        <p class="utterance__text" data-utterance data-idle="true" aria-live="polite">
          Waiting for a nudge.
        </p>
        <div class="utterance__actions">
          <button class="ghost cursor-target" type="button" data-speak-again>Speak again</button>
          <button class="ghost ghost--warn cursor-target" type="button" data-regenerate>Not what I meant</button>
        </div>
      </div>
      <p class="keyhint">
        Arrows move &middot; Enter speaks &middot; R regenerates &middot; M toggles the mic &middot; 1&ndash;8 jump to a slot
      </p>
    </footer>

  </div>

  <script type="module" src="speak.js"></script>
</body>
</html>
